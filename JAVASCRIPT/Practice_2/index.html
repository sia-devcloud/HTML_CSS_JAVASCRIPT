<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <title>Simple_Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="mainContainer">
      <input type="text" id="inputDisplay" readonly>
      <div class="buttonSetUp">
        <button class="calcButton clearDisplay">C</button>
        <button class="calcButton calcButton_1">1</button>
        <button class="calcButton calcButton_2">2</button>
        <button class="calcButton calcButton_add">+</button>
        <button class="calcButton calcButton_3">3</button>
        <button class="calcButton calcButton_4">4</button>
        <button class="calcButton calcButton_sub">-</button>
        <button class="calcButton calcButton_5">5</button>
        <button class="calcButton calcButton_6">6</button>
        <button class="calcButton calcButton_multiply">*</button>
        <button class="calcButton calcButton_7">7</button>
        <button class="calcButton calcButton_8">8</button>
        <button class="calcButton calcButton_divide">/</button>
        <button class="calcButton calcButton_assignment">=</button>
        <button class="calcButton calcButton_9">9</button>
        <button class="calcButton calcButton_0">0</button>
        <button class="calcButton calcButton_dot">.</button>
      </div>
    </div>
  </body>
</html>
