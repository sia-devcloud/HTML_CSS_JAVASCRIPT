<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sidebar_With_Toggle</title>
        <link rel="stylesheet" href="style.css">
        <script 
        src="https://kit.fontawesome.com/3c13c40351.js"
        crossorigin="anonymous">
    </script>
    </head>
    <body>
        <!--Toggle button settings start-->
        <input type="checkbox" id="toggle" name="checkbox">
        <!--Toggle button settings end-->
        <div class="dashboardContainer">
            <div class="sidebarHeader">
                <img class="headingLogo" src="education_logo.jpg">
            <span class="logo">SIA's Help</span>
            </div>
            <div class="toggleButton">
                <label for="toggle">
                     <li class="menu">
                        <i class="fa-solid fa-chevron-right"></i>
                    </li>
                </label>
            </div>
            <div class="navigationMenu">
                <ul>
                    <li class="sideBarItem"><a href=""><i class="fa-solid fa-house"></i><span class="menuText">Home</span></a></li>
                    <li class="sideBarItem"><a href=""><i class="fa-solid fa-user"></i><span class="menuText">User</span></a></li>
                    <li class="sideBarItem"><a href=""><i class="fa-regular fa-file"></i><span class="menuText">Files</span></a></li>
                    <li class="sideBarItem"><a href=""><i class="fa-solid fa-download"></i><span class="menuText">Download</span></a></li>
                    <li class="sideBarItem"><a href=""><i class="fa-solid fa-calendar"></i><span class="menuText">Events</span></a></li>
                    <li class="sideBarItem"><a href=""><i class="fa-solid fa-message"></i><span class="menuText">Messages</span></a></li>
                    <li class="sideBarItem"><a href=""><i class="fa-solid fa-chart-line"></i><span class="menuText">Analytics</span></a></li>
                    <li class="sideBarItem"><a href=""><i class="fa-solid fa-phone"></i><span class="menuText">Contact</span></a></li>
                </ul>
            </div>
            <div class="settings">
                <ul>
                    <li class="sideBarItem"><a href=""><i class="fa-solid fa-gear"></i><span class="menuText">Settings</span></a></li>
                </ul>
            </div>
        </div>
    </body>
</html>
