<!DOCTYPE html>
<html>
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login_Form</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/3c13c40351.js" crossorigin="anonymous"></script>
 </head>
 <body>
   <div class="container">
      <h2 class="t_Center">Login</h2>
      <form action="">
          <div class="inputDiv">
              <label for="name" class="username">Username</label>
              <div class="userarea">
                <i class="fa-solid fa-user"></i><input type="text" name="name" id="name" placeholder="Enter your Username">
              </div>
              <hr>
              </div>
              <div class="inputDiv">
                  <label for="password" class="username">Password</label>
                  <div class="userarea">
                    <i class="fa-solid fa-key"></i><input type="password" name="password" id="password" placeholder="Enter your password">
                  </div>
                  <hr>
              </div>
              <span class="Forgot_pass">Forgot password</span>
              <button class="btn">Login</button>
              <div class="form_button">
                <p>Or Sign up using</p>
                <ul class="alternative">
                  <a href="https://www.facebook.com" target="_blank">
                    <i class="fa-brands fa-facebook"></i>
                  </a>
                  <a href="https://www.twitter.com" target="_blank">
                    <i class="fa-brands fa-telegram"></i>
                  </a>
                  <a href="https://www.gmail.com" target="_blank">
                    <i class="fa-brands fa-google"></i>
                  </a>
                </ul>
                <p class="signUp">Or</p>
                <p id="signUp">SIGN UP</p>
              </div>
          </div>
      </form>
   </div>
 </body>
</html>
