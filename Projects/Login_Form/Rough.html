<!DOCTYPE html>
<html>
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, intial-scale=1.0">
  <link rel="stylesheet" href="Rough.css">
  <script src="https://kit.fontawesome.com/3c13c40351.js" crossorigin="anonymous"></script>
 </head>
 <body>
   <div class="container">
      <h2 class="formTitle">Login</h2>
      <form action="">
       <div class="inputArea">
          <label for="name" class="username">Username</label>
          <div class="userArea">
            <i class="fa-solid fa-user"></i><input type="name" id="username" name="name" placeholder="Enter your username" required>
          </div>
       </div>
       <div class="inputArea">
          <label for="password" class="username">Password</label>
          <div class="userArea">
          <i class="fa-solid fa-key"></i><input type="password" id="password" name="password" placeholder="Type your password">
          </div>
       </div>
       <span class="Forgot_pass">Forgot password</span>
       <button class="login_btn">Login</button>
       <div class="alt_login">
          <p>Or Sign Up Using</p>
          <ul class="alt_login_options">
            <a href="https://www.facebook.com" target="_blank"><li><i class="fa-brands fa-facebook"></i></li></a>
            <a href="https://www.telegram.com" target="_blank"><li><i class="fa-brands fa-telegram"></i></li></a>
            <a href="https://www.google.com" target="_blank"><li><i class="fa-brands fa-google"></i></li></a>
          </ul>
          <p class="signUp">SIGN UP</p>
       </div>
     </form>
   </div>
 </body>
</html>
