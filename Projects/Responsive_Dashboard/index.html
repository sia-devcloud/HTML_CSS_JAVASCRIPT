<!DOCTYPE html>
<html>
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive_Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/3c13c40351.js" crossorigin="anonymous"></script>
 </head>
  <body>
    <div class="mainContainer">
      <div class="sidebar">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>SIA's Help</span>
        <div class="menuOption">
          <ul>
            <i class="fa-solid fa-house"></i><a href="">Dashboard</a>
            <i class="fa-solid fa-copy"></i><a href="">Content</a>
            <i class="fa-solid fa-chart-line"></i><a href="">Analytics</a>
            <i class="fa-solid fa-thumbs-up"></i><a href="">Likes</a>
            <i class="fa-solid fa-comment"></i><a href="">Comments</a>
            <i class="fa-solid fa-download"></i><a href="">Downloads</a>
            <i class="fa-solid fa-share"></i><a href="">Share</a>
            <i class="fa-solid fa-rectangle-ad"></i><a href="">Ads</a>
          </ul>
        </div>
        <div class="sideBottom">
          <i class="fa-solid fa-gear"></i><a href="">Settings</a>
          <i class="fa-solid fa-power-off"></i><a href="">Logout</a>
        </div>
      </div>
      <div class="Dashboard">
        <div class="rightHeader">
          <i class="fa-solid fa-bars"></i>
          <input type="text" placeholder="Shahinur">
          <i class="fa-solid fa-user"></i>
        </div>
        <p>Dashboard</p>
        <!-- Card information Strat -->
        <div class="cards">
          <div class="cardsLike">
            <i class="fa-solid fa-thumbs-up"></i>
            <p class="cardTitle">Total Likes</p>
            <h3 class="cardValue">54230</h3>
          </div>
          <div class="cardsComments">
            <i class="fa-solid fa-comment"></i>
            <p class="cardTitle">Total Comments</p>
            <h3 class="cardValue">24350</h3>
          </div>
          <div class="cardsShare">
            <i class="fa-solid fa-share"></i>
            <p class="cardTitle">Total Share</p>
            <h3 class="cardValue">10280</h3>
          </div>
          <div class="cardDownload">
            <i class="fa-solid fa-download"></i>
            <p class="cardTitle">Total Downloads</p>
            <h3 class="cardValue">18750</h3>
          </div>
        </div>
        <!-- Card information Ends -->
      </div>
    </div>
  </body>
</html>
