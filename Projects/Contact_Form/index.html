<!DOCTYPE html>
<html>
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact_Form</title>
  <link rel="stylesheet" href="style.css">
 </head>
 <body>
    <div id="main">
       <form class="container">
          <h2>GET IN TOUCH</h2>
          <input type="name" id="name" placeholder="Enter your name" required>
          <input type="email" id="email" placeholder="Enter your email" required>
          <input type="phone" id="phone" placeholder="Enter your phone" required>
          <input type="coupon" id="coupon" placeholder="Enter your coupon">
          <textarea id="message" rows="4" placeholder="Write something"></textarea>
          <button class="btn" type="submit">Submit</button>
       </form>
    </div>
 </body>
</html>
