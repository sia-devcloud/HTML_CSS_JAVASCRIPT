<!DOCTYPE html>
<html>
  <head>
    <style>
       p{
        color:red;
       }
       #check{
        color:orange;
       }
       .check-1{
        color:blue;
       }
       h2{
        color:red !important;
       }
       #check_1{
        color:blue;
       }
    </style>
  </head>
 <body>
    <p id="check" class="check-1">This is a simple test of Spcificity in CSS</p>
    <h2 id="check_1" style="color:yellow">This is an example for !important</h2>
 </body>
</html>
