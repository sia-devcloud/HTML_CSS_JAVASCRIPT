<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="Rough.css">
        <script src="Rough.js"></script>
        <title>Simple_Calculator</title>
    </head>
    <body>
        <div class="calContainer">
            <input type="text" id="inputValue" readonly>
            <div class="buttonContainer">
                <button class="calButton" onclick="currDisplay=''; document.querySelector('#inputValue').value=currDisplay;";>C</button>
                
                <button class="calButton" onclick="currDisplay=currDisplay+'1'; document.querySelector('#inputValue').value=currDisplay; console.log(currDisplay); console.log(typeof(currDisplay));">1</button>
                
                <button class="calButton" onclick="currDisplay=currDisplay+'2'; document.querySelector('#inputValue').value=currDisplay; console.log(currDisplay); console.log(typeof(currDisplay));">2</button>
                
                <button class="calButton" onclick="currDisplay=currDisplay+'+'; document.querySelector('#inputValue').value=currDisplay; console.log(currDisplay); console.log(typeof(currDisplay));">+</button>
                
                <button class="calButton" onclick="currDisplay=currDisplay+'3'; document.querySelector('#inputValue').value=currDisplay; console.log(currDisplay); console.log(typeof(currDisplay));">3</button>
                
                <button class="calButton" onclick="currDisplay=currDisplay+'4'; document.querySelector('#inputValue').value=currDisplay; console.log(currDisplay); console.log(typeof(currDisplay));">4</button>
                
                <button class="calButton" onclick="currDisplay=currDisplay+'-'; document.querySelector('#inputValue').value=currDisplay; console.log(currDisplay); console.log(typeof(currDisplay));">-</button>
                
                <button class="calButton" onclick="currDisplay=currDisplay+'5'; document.querySelector('#inputValue').value=currDisplay; console.log(currDisplay); console.log(typeof(currDisplay));">5</button>
                
                <button class="calButton" onclick="currDisplay=currDisplay+'6'; document.querySelector('#inputValue').value=currDisplay; console.log(currDisplay); console.log(typeof(currDisplay));">6 </button>
                
                <button class="calButton" onclick="currDisplay=currDisplay+'*'; document.querySelector('#inputValue').value=currDisplay; console.log(currDisplay); console.log(typeof(currDisplay));">*</button>
                
                <button class="calButton" onclick="currDisplay=currDisplay+'7'; document.querySelector('#inputValue').value=currDisplay; console.log(currDisplay); console.log(typeof(currDisplay))">7</button>
                
                <button class="calButton" onclick="currDisplay=currDisplay+'8'; document.querySelector('#inputValue').value=currDisplay; console.log(currDisplay); console.log(typeof(currDisplay));">8</button>
                
                <button class="calButton" onclick="currDisplay=currDisplay+'/'; document.querySelector('#inputValue').value=currDisplay; console.log(currDisplay); console.log(typeof(currDisplay));">/</button>
                
                <button class="calButton"onclick="currDisplay=eval(currDisplay); document.querySelector('#inputValue').value=currDisplay; console.log(currDisplay); console.log(typeof(currDisplay));" >=</button>
                
                <button class="calButton" onclick="currDisplay=currDisplay+'9'; document.querySelector('#inputValue').value=currDisplay; console.log(currDisplay); console.log(typeof(currDisplay));">9</button>
                
                <button class="calButton" onclick="currDisplay=currDisplay+'0'; document.querySelector('#inputValue').value=currDisplay; console.log(currDisplay); console.log(typeof(currDisplay));">0</button>
                
                <button class="calButton" onclick="currDisplay=currDisplay+'.'; document.querySelector('#inputValue').value=currDisplay; console.log(currDisplay); console.log(typeof(currDisplay));">.</button>
            </div>
        </div>
        <script>
            let currDisplay='';
        </script>
    </body>
</html>
