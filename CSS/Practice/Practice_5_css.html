<!DOCTYPE html>
<html>
  <head>
   <style>
    p{
     color:rgb(69, 3, 212)
    }
    div > p{
     color:#ff0f9f
    }
   </style>
  </head>
 <body>
  <p>Checking RGB and Hex colors</p>
  <div>
    <section>
      <p>This is grandchild of div</p>
    </section>
  </div>
  <!--Creating direct child of <div>-->
   <div>
    <p>This is an example of direct child of div</p>
   </div>
 </body>
</html>
