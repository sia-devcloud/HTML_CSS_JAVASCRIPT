<!DOCTYPE html>
<html>
  <head>
    <style>
      #Logo{
        color: orange;
        font-size:25px;
      }
      #search-button{
        background-color: orange;
      }
      header{
        background-color: black;
        height:55px;
        border:5px solid white;
      }
      a{
        color:white;
        margin-right:200px;
        text-decoration:none;
      }
      body{
        background-color:cadetblue
      }
      .ContentBox{
       height:100px;
       width:100px;
       border:3px solid black;
       margin: 10px;
      }
      #content{
       margin-bottom:250px;
      }
      footer{
       text-align:center;
      }
    </style>
    <title>Navigation_Bar</title>
  </head>
  <body>
    <header id="header">
      <a id="Logo" style="margin-left:10px;" href="#">amazon.in</a>
      <a href="#">Account</a>
      <a href="#">My Cart</a>
      <a href="#">Contact Us</a>
        <input placeholder="Search Amazon.in">
        <button id="search-button">Search</button>
    </header>
    <div id="content">
      <div class="ContentBox" style="background-color:blueviolet">Electronics</div>
      <div class="ContentBox" style="background-color:orange">Clothes</div>
      <div class="ContentBox" style="background-color:chartreuse">Daily Essentials</div>
    </div>
    <footer>
     Conditions of Use & Sale
Privacy Notice
Interest-Based Ads
© 1996-2026, Amazon.com, Inc. or its affiliates
    </footer>
  </body>
</html>
