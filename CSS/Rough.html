<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Transform</title>
   <style>
      div{
         position:absolute;
         top: 200px;
         left:300px;
         height:200px;
         width:250px;
         padding-left: 100px;
         padding-top:100px;
         box-sizing: border-box;
         background-color: blue;
         transition-delay:1s;
      }
      div:hover{
         transform:rotate(45deg) scale(0.5, 0.5) translate(900px);
          transition-timing-function: ease-in;
      }
   </style>
</head>
<body>
   <div id="Mult_Transform">Mlti_Tr</div>
</body>
</html>
